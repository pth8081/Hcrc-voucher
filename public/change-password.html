<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doi mat khau - HCRC Voucher Redemption</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ee7d1a" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HCRC Voucher" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">
          <svg width="52" height="52" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 12.5V9.8a6 6 0 0 1 12 0v2.7" stroke="#ee7d1a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <rect x="5" y="12" width="24" height="17" rx="5.5" fill="#56a13a"/>
            <path d="M12.3 20.3c1 1.7 2.9 2.6 4.7 2.6s3.7-.9 4.7-2.6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span class="brand-word">HCRC</span>
        <span class="brand-tagline">He thong thu hoi voucher doi tac</span>
      </div>

      <p class="login-title">Doi mat khau truoc khi tiep tuc</p>
      <p class="hint mb-10">
        Day la lan dau tien tai khoan nay dang nhap vao ung dung (hoac mat khau da bi dat lai) -
        vui long dat mat khau moi. Mat khau phai co it nhat 8 ky tu, gom ca chu, so va ky tu dac
        biet (vd: ! @ # $ %...).
      </p>

      <form id="changePasswordForm">
        <label>Mat khau moi</label>
        <input id="newPassword" type="password" required autocomplete="new-password" placeholder="••••••••" />
        <label>Nhap lai mat khau moi</label>
        <input id="confirmPassword" type="password" required autocomplete="new-password" placeholder="••••••••" />
        <button class="btn-primary btn-block mt-10" type="submit">Doi mat khau &amp; tiep tuc</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/twofa.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
