<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bao cao doi soat - HCRC Voucher Redemption</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>

  <div class="container">
    <div class="card">
      <h2>Doi soat voucher da thu hoi</h2>
      <label>Ngay</label>
      <input id="reportDate" type="date" />
      <button id="loadBtn" class="btn-primary">Xem bao cao</button>
    </div>

    <div class="card">
      <h3>Tong hop theo dia diem</h3>
      <table>
        <thead><tr><th>Dia diem</th><th>So luong</th><th>Tong tien</th></tr></thead>
        <tbody id="summaryBody"><tr><td colspan="3" class="text-muted">Chua co du lieu</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Chi tiet giao dich</h3>
      <table>
        <thead><tr><th>Gio</th><th>TRANS_NUM</th><th>Ma voucher</th><th>Nguoi thu hoi</th><th>Dia diem</th><th>Menh gia</th></tr></thead>
        <tbody id="detailBody"><tr><td colspan="6" class="text-muted">Chua co du lieu</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
