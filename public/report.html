<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Báo cáo đối soát - HCRC Voucher Redemption</title>
<link rel="stylesheet" href="/css/fonts.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/summary-report.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ee7d1a" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HCRC Voucher" />
</head>
<body>
  <div id="topbar"></div>

  <div class="container container-wide">
    <div class="card">
      <h2>Đối soát voucher đã thu hồi</h2>
      <div class="summary-filters">
        <div class="field">
          <label>Từ ngày</label>
          <input id="fromDate" type="date" />
        </div>
        <div class="field">
          <label>Đến ngày</label>
          <input id="toDate" type="date" />
        </div>
        <div class="field">
          <label>Công ty thu</label>
          <select id="filterCompany"><option value="">Đang tải...</option></select>
        </div>
        <div class="field">
          <label>Điểm thu hồi</label>
          <select id="filterUnit"><option value="">Đang tải...</option></select>
        </div>
        <div class="field">
          <label>Tài khoản thu hồi</label>
          <select id="filterUser"><option value="">Đang tải...</option></select>
        </div>
        <div class="field hidden" id="filterSystemField">
          <label>Hệ thống voucher</label>
          <select id="filterSystem"><option value="">Đang tải...</option></select>
        </div>
        <button id="loadBtn" class="btn-primary">Xem báo cáo</button>
        <button id="exportBtn" class="btn-secondary">Xuất Excel</button>
      </div>
    </div>

    <div class="card">
      <h3>Tổng hợp theo địa điểm</h3>
      <div class="table-wrap table-responsive">
      <table>
        <thead><tr><th>Công ty</th><th>Địa điểm</th><th>Số lượng</th><th>Tổng tiền</th></tr></thead>
        <tbody id="summaryBody"><tr><td colspan="4" class="text-muted">Chưa có dữ liệu</td></tr></tbody>
      </table>
      </div>
    </div>

    <div class="card">
      <h3>Chi tiết giao dịch</h3>
      <div class="table-wrap table-responsive">
      <table>
        <thead><tr><th>Ngày giờ</th><th>TRANS_NUM</th><th>Mã voucher</th><th>Người thu hồi</th><th>Công ty</th><th>Địa điểm</th><th>Hệ thống</th><th>Mệnh giá</th></tr></thead>
        <tbody id="detailBody"><tr><td colspan="8" class="text-muted">Chưa có dữ liệu</td></tr></tbody>
      </table>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/vendor/simplewebauthn-browser.umd.min.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/reportFilters.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
