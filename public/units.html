<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Don vi thu hoi - HCRC Voucher Redemption</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="topbar"></div>

  <div class="container">
    <div class="card">
      <h2>Them don vi thu hoi</h2>
      <form id="unitForm">
        <label>Dia diem (Locations_Detail) *</label>
        <select id="locationDetailId" required></select>
        <label>Ma doi tac (PartnerCode) *</label>
        <input id="partnerCode" required />
        <label>Ten doi tac (PartnerName) *</label>
        <input id="partnerName" required />
        <label>Nguoi lien he</label>
        <input id="contactName" />
        <label>So dien thoai</label>
        <input id="contactPhone" />
        <label>Email</label>
        <input id="contactEmail" />
        <label>Dia chi</label>
        <input id="address" />
        <label>Ma so thue</label>
        <input id="taxCode" />
        <label>So tai khoan ngan hang</label>
        <input id="bankAccount" />
        <label>Ten ngan hang</label>
        <input id="bankName" />
        <label>Han muc thu hoi/ngay (tuy chon)</label>
        <input id="dailyLimitAmount" type="number" min="0" step="1000" />
        <button class="btn-primary btn-block" type="submit">Luu don vi</button>
      </form>
    </div>

    <div class="card">
      <h2>Danh sach don vi thu hoi</h2>
      <table>
        <thead>
          <tr>
            <th>Ma DT</th><th>Ten doi tac</th><th>Dia diem</th><th>Lien he</th><th>Trang thai</th>
          </tr>
        </thead>
        <tbody id="unitsBody"><tr><td colspan="5" style="color:#999;">Dang tai...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/units.js"></script>
</body>
</html>
