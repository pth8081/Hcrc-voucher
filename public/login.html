<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dang nhap - HCRC Voucher Redemption</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ee7d1a" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HCRC Voucher" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">
          <svg width="52" height="52" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 12.5V9.8a6 6 0 0 1 12 0v2.7" stroke="#ee7d1a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <rect x="5" y="12" width="24" height="17" rx="5.5" fill="#56a13a"/>
            <path d="M12.3 20.3c1 1.7 2.9 2.6 4.7 2.6s3.7-.9 4.7-2.6" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        <span class="brand-word">HCRC</span>
        <span class="brand-tagline">He thong thu hoi voucher doi tac</span>
      </div>

      <p class="login-title">Dang nhap de tiep tuc</p>

      <form id="loginForm">
        <label>Ten dang nhap</label>
        <input id="username" required autocomplete="username" placeholder="vd: nhanvien1" />
        <label>Mat khau</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        <button class="btn-primary btn-block mt-6" type="submit">Dang nhap</button>
      </form>

      <button id="webauthnLoginBtn" class="btn-secondary btn-block mt-10 hidden" type="button">
        Dang nhap bang van tay / Face ID
      </button>

      <p class="login-footer">
        © 2026 Cong ty TNHH Xuat - Nhap khau &amp; Ban le hang tieu dung Ha Noi (HCRC)<br />
        Ung dung noi bo danh cho don vi doi tac thu hoi voucher
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/vendor/simplewebauthn-browser.umd.min.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
